services:
  - type: web
    name: philosophy-ews
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
  - type: web
    name: philosophy-ews-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node api/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: DATABASE_URL
        fromDatabase:
          name: philosophy-ews-db
          property: connectionString
      - key: APP_ORIGIN
        value: https://philosophy-ews.onrender.com
      - key: PUBLIC_APP_URL
        value: https://philosophy-ews.onrender.com
      - key: AUTOMATION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: philosophy-ews-db
    databaseName: philosophy_ews
    user: philosophy_ews
    plan: free
