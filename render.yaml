services:
  - type: web
    name: philosophy-ews
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Start the installed binary directly so Render does not invoke Corepack
    # again after the build and try to download a different pnpm version.
    startCommand: ./node_modules/.bin/wrangler dev --config dist/server/wrangler.json --ip 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
  - type: web
    name: philosophy-ews-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node api/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: DATABASE_URL
        fromDatabase:
          name: philosophy-ews-db
          property: connectionString
      - key: APP_ORIGIN
        value: https://philosophy-ews.onrender.com
      - key: PUBLIC_APP_URL
        value: https://philosophy-ews.onrender.com
      - key: AUTOMATION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: philosophy-ews-db
    databaseName: philosophy_ews
    user: philosophy_ews
    plan: free
